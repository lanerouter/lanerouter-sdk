[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lanerouter"
version = "0.1.0"
description = "Live road conditions for the agent web. Check a website or API before your agent acts, report what happened after."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "LaneRouter" }]
keywords = ["agents", "ai-agents", "mcp", "web-agents", "rate-limits", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://lanerouter.com"
Documentation = "https://lanerouter.com/connect"
Changelog = "https://lanerouter.com/changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/lanerouter"]

[tool.hatch.build.targets.sdist]
include = ["src/lanerouter", "tests", "README.md", "LICENSE", "pyproject.toml"]
